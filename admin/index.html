<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0e1210" />
<title>Chakudya admin · Overview</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<main id="root"></main>

<template id="tpl">
  <h2>Health</h2>
  <div id="health" class="card muted">Loading…</div>

  <h2>Needs attention</h2>
  <div id="glance" class="grid"></div>
  <p class="muted">Tap a card to open that page.</p>

  <h2>Registry records <span id="regTotal" class="muted"></span></h2>
  <div id="registry" class="grid"></div>
</template>

<script src="../js/config.js"></script>
<script src="admin.js"></script>
<script>
(() => {
  "use strict";
  const { $, esc, fmt, stat, call } = Admin;

  function renderHealth(r) {
    const el = $("health");
    if (r.status !== 200 || !r.body) { el.innerHTML = `<span class="dot bad"></span>Health check failed (${r.status || "network"})`; return; }
    const h = r.body;
    const healthy = h.status === "healthy";
    const rows = Object.entries(h.services || {}).map(([k, v]) => {
      const st = v?.status || "unknown";
      const cls = ["ok", "configured", "bound"].includes(st) ? "ok" : st === "error" ? "bad" : "warn";
      return `<div class="svc"><span><span class="dot ${cls}"></span>${esc(k.replace(/_/g, " "))}</span><span class="muted">${esc(st)}</span></div>`;
    }).join("");
    el.innerHTML = `<div class="bar"><b><span class="dot ${healthy ? "ok" : "bad"}"></span>${esc(h.status || "unknown")}</b><span class="muted">API v${esc(h.version || "?")}</span></div>${rows}`;
    el.classList.remove("muted");
  }

  const link = (href, label, n) => `<a class="stat${typeof n === "number" ? "" : " null"}" href="${href}"><b>${fmt(n)}</b><span>${esc(label)}</span></a>`;

  function renderOverview(d) {
    const reg = d.registry || [];
    const total = reg.reduce((n, r) => n + (typeof r.count === "number" ? r.count : 0), 0);
    $("regTotal").textContent = "· " + fmt(total) + " rows";
    $("registry").innerHTML = reg.map((r) => stat(r.label, r.count)).join("");

    const p = d.packaged_review || {}, j = d.rag_ingest_jobs || {}, k = d.api_keys || {};
    $("glance").innerHTML = link("review.html", "Foods pending review", p.pending)
      + link("ingest.html", "Ingest jobs failed", j.failed)
      + link("ingest.html", "Ingest jobs queued", j.queued)
      + link("keys.html", "Active API keys", k.active)
      + link("keys.html", "Key calls today", k.usage_today);
  }

  Admin.mount({
    id: "overview",
    title: "Overview",
    async refresh() {
      const [d, hl] = await Promise.all([Admin.overview(), call("/health")]);
      if (Admin.authFail(hl) || !d) return;
      renderHealth(hl);
      renderOverview(d);
    },
  });
})();
</script>
</body>
</html>
