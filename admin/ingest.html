<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0e1210" />
<title>Chakudya admin · RAG ingest</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<main id="root"></main>

<template id="tpl">
  <h2>Upload a document</h2>
  <div class="card" id="upCard">
    <div class="filters">
      <input id="upFile" type="file" accept=".pdf,.docx,.txt,.md,.csv,.html" aria-label="Document to ingest" />
    </div>
    <div class="filters" style="margin-top:8px">
      <input id="upSource" type="text" maxlength="200" placeholder="Source name for citations (optional, defaults to the file name)" aria-label="Source name" />
      <select id="upContext" aria-label="Context">
        <option value="clinical">Clinical</option><option value="general">General</option><option value="both">Both</option>
      </select>
    </div>
    <p style="margin:8px 0"><label class="chk"><input id="upReplace" type="checkbox" /> Replace existing chunks with the same source name</label></p>
    <button id="upGo" class="primary">Upload and ingest</button>
    <div id="upBar" style="margin-top:8px"></div>
    <p id="upMsg" class="muted" role="status"></p>
    <p class="muted" style="margin:0">PDF, DOCX, TXT, MD, CSV or HTML, up to 25 MB. Scanned or image-only PDFs can't be read; use manual ingest for those.</p>
  </div>

  <h2>RAG ingest jobs</h2>
  <div id="jobs" class="grid"></div>
  <div id="jProgress" class="card" style="margin-top:10px"></div>
  <div class="bar" style="gap:6px;margin:12px 0 8px" id="jFilter">
    <button data-st="" class="chip on">All</button><button data-st="queued" class="chip">Queued</button><button data-st="processing" class="chip">Processing</button><button data-st="done" class="chip">Done</button><button data-st="failed" class="chip">Failed</button>
  </div>
  <p id="jMsg" class="muted" role="status"></p>
  <div id="jobList"></div>
  <button id="jMore" class="hide">Load more</button>
  <p class="muted">Upload and retry are done through the API. Dismiss removes only the job record from this list; ingested chunks are not changed.</p>
</template>

<script src="../js/config.js"></script>
<script src="admin.js"></script>
<script>
(() => {
  "use strict";
  const { $, esc, fmt, stat, bar, ago, call, upload } = Admin;
  const J_PAGE = 20;
  let jStatus = "";
  let jLoaded = [];
  let jTotal = null;
  const JOB_CLS = { queued: "warn", processing: "run", done: "ok", failed: "bad" };

  // Only a status is stored per job (no live percentage), so a job shows 0% while queued, a working bar while processing and 100% when done.
  function jobBar(j) {
    if (j.status === "queued") return bar({ text: "Waiting in queue", pct: 0 });
    if (j.status === "processing") return bar({ text: "Processing", run: true });
    if (j.status === "done") return bar({ text: "Done", pct: 100, cls: "ok" });
    if (j.status === "failed") return bar({ text: "Failed", pct: 100, cls: "bad", noPct: true });
    return "";
  }

  // Share of all jobs by state. Finished = done; failed and in-progress shown beside it. 0% with an empty bar when there are no jobs.
  function renderProgress(j) {
    const n = (k) => Math.max(0, Number(j[k]) || 0);
    const q = n("queued"), p = n("processing"), d = n("done"), f = n("failed"), total = q + p + d + f;
    const share = (x) => (total ? (x / total) * 100 : 0);
    const text = total ? `${fmt(d)} of ${fmt(total)} jobs finished` : "No ingest jobs yet";
    const legend = total
      ? `Done ${+share(d).toFixed(1)}% · Processing ${+share(p).toFixed(1)}% · Queued ${+share(q).toFixed(1)}% · Failed ${+share(f).toFixed(1)}%`
      : "Done 0% · Processing 0% · Queued 0% · Failed 0%";
    $("jProgress").innerHTML = bar({ text, pct: share(d), segs: [{ pct: share(d), cls: "ok" }, { pct: share(p) }, { pct: share(f), cls: "bad" }] })
      + `<div class="muted">${esc(legend)}</div>`;
  }

  // A queued/processing job updated in the last 10 minutes may still be running, so it cannot be dismissed (the API enforces the same rule).
  const STALE_MS = 10 * 60 * 1000;
  function canDismiss(j) {
    if (!j.id) return false;
    if (j.status !== "queued" && j.status !== "processing") return true;
    const t = new Date(j.updated_at || j.created_at).getTime();
    return !isFinite(t) || Date.now() - t >= STALE_MS;
  }

  const UP_MAX = 25 * 1024 * 1024;
  const UP_EXT = ["pdf", "docx", "txt", "md", "csv", "html"];
  let uploading = false;

  async function doUpload() {
    if (uploading) return;
    const f = $("upFile").files[0];
    const msg = (t) => { $("upMsg").textContent = t; };
    if (!f) { msg("Choose a file first."); return; }
    const ext = f.name.split(".").pop().toLowerCase();
    if (!UP_EXT.includes(ext)) { msg("Unsupported file type. Use PDF, DOCX, TXT, MD, CSV or HTML."); return; }
    if (f.size > UP_MAX) { msg("That file is over 25 MB."); return; }
    if (!f.size) { msg("That file is empty."); return; }
    const form = new FormData();
    form.set("file", f, f.name);
    form.set("context", $("upContext").value);
    const src = $("upSource").value.trim();
    if (src) form.set("source", src);
    if ($("upReplace").checked) form.set("replace", "true");
    uploading = true; $("upGo").disabled = true; msg("");
    $("upBar").innerHTML = bar({ text: "Uploading " + f.name, pct: 0 });
    const r = await upload("/rag/upload", form, (p) => { $("upBar").innerHTML = bar({ text: "Uploading " + f.name, pct: p * 100 }); });
    uploading = false; $("upGo").disabled = false;
    if (Admin.authFail(r)) { $("upBar").innerHTML = ""; return; }
    if (r.status === 200 || r.status === 201) {
      $("upBar").innerHTML = bar({ text: "Uploaded. Queued for ingestion", pct: 100, cls: "ok" });
      msg("Queued. It shows in the list below and moves from queued to processing to done.");
      $("upFile").value = ""; $("upSource").value = ""; $("upReplace").checked = false;
      Admin.reload();
      return;
    }
    $("upBar").innerHTML = "";
    msg(r.status === 403 ? "The gateway has not enabled uploads yet. Deploy the gateway update."
      : r.status === 405 ? "The gateway does not allow uploads yet. Deploy the gateway update."
      : r.status === 0 ? "Network error. Check your connection and try again."
      : (r.body?.message || r.body?.error || "Upload failed (" + r.status + ")."));
  }

  async function dismissJob(id, btn) {
    const j = jLoaded.find((x) => x.id === id);
    if (!confirm(`Dismiss "${j?.file_name || "this job"}"? This removes the job record only; ingested chunks stay.`)) return;
    btn.disabled = true;
    const r = await call("/rag/jobs/" + encodeURIComponent(id), { method: "DELETE" });
    if (Admin.authFail(r)) return;
    if (r.status === 200) { Admin.reload(); return; }
    btn.disabled = false;
    $("jMsg").textContent = r.status === 403 ? "The gateway has not enabled dismiss yet. Deploy the gateway update."
      : r.status === 405 || r.status === 404 && !r.body?.message ? "The API does not support dismiss yet. Deploy the API update."
      : (r.body?.message || r.body?.error || "Couldn't dismiss the job (" + (r.status || "network") + ").");
  }

  function jobCard(j) {
    const cls = JOB_CLS[j.status] || "";
    const chunks = typeof j.chunk_count === "number" ? ` · ${fmt(j.chunk_count)} chunks` : "";
    const tries = j.attempts ? ` · ${Number(j.attempts)} attempt${Number(j.attempts) === 1 ? "" : "s"}` : "";
    const rep = j.replace ? ' <span class="pill">replaces existing</span>' : "";
    return `<div class="ev"><div class="head"><div><b>${esc(j.file_name || "Unnamed file")}</b> <span class="pill ${cls}">${esc(j.status)}</span> <span class="pill">${esc(j.context || "both")}</span>${rep}</div>
      <span class="muted">${esc(ago(j.created_at))}</span></div>
      <div class="muted" style="word-break:break-word">${esc(j.source || "")}</div>
      <div class="muted">Updated ${esc(ago(j.updated_at))}${chunks}${tries} · <span style="font-family:var(--mono)">${esc(String(j.id || "").slice(0, 8))}</span></div>
      ${jobBar(j)}
      ${j.error ? `<p class="err-text">${esc(j.error)}</p>` : ""}
      ${canDismiss(j) ? `<div style="margin-top:8px"><button class="chip" data-dismiss="${esc(j.id)}" aria-label="Dismiss ${esc(j.file_name || "job")}">Dismiss</button></div>` : ""}</div>`;
  }

  function renderJobs() {
    $("jobList").innerHTML = jLoaded.map(jobCard).join("");
    const more = typeof jTotal === "number" ? jLoaded.length < jTotal : false;
    $("jMore").classList.toggle("hide", !more);
    $("jMsg").textContent = jLoaded.length
      ? `Showing ${jLoaded.length}${typeof jTotal === "number" ? " of " + fmt(jTotal) : ""}, newest first.`
      : "No ingest jobs" + (jStatus ? " with status " + jStatus : "") + ".";
  }

  // reset = true: reload from the first page, keeping as many rows as are already shown (so auto refresh doesn't collapse the list).
  async function loadJobs(reset) {
    const limit = reset ? Math.min(100, Math.max(J_PAGE, jLoaded.length)) : J_PAGE;
    const offset = reset ? 0 : jLoaded.length;
    const qs = `?limit=${limit}&offset=${offset}` + (jStatus ? "&status=" + jStatus : "");
    const r = await call("/rag/jobs" + qs);
    if (Admin.authFail(r)) { $("jMsg").textContent = ""; return; }
    if (r.status !== 200 || !Array.isArray(r.body?.data)) {
      $("jMsg").textContent = r.status === 403 ? "The gateway has not enabled the ingest job list yet (add /rag/jobs to ADMIN_GET_PATHS)." : "Couldn't load ingest jobs (" + (r.status || "network") + ").";
      $("jMore").classList.add("hide");
      return;
    }
    jLoaded = reset ? r.body.data : jLoaded.concat(r.body.data);
    // Older API versions return no total: fall back to "more if the page was full".
    jTotal = typeof r.body.total === "number" ? r.body.total : (r.body.data.length >= limit ? jLoaded.length + 1 : jLoaded.length);
    renderJobs();
  }

  Admin.mount({
    id: "ingest",
    title: "RAG ingest",
    init() {
      Admin.chips("jFilter", "st", (v) => { jStatus = v; jLoaded = []; jTotal = null; loadJobs(true); });
      $("upGo").addEventListener("click", doUpload);
      $("jMore").addEventListener("click", () => loadJobs(false));
      $("jobList").addEventListener("click", (e) => {
        const b = e.target.closest("[data-dismiss]");
        if (b) dismissJob(b.dataset.dismiss, b);
      });
    },
    async refresh() {
      const d = await Admin.overview();
      if (!d) return;
      const j = d.rag_ingest_jobs || {};
      renderProgress(j);
      $("jobs").innerHTML = ["queued", "processing", "done", "failed"].map((k) => stat(k[0].toUpperCase() + k.slice(1), j[k])).join("");
      await loadJobs(true);
    },
  });
})();
</script>
</body>
</html>
