<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0e1210" />
<title>Chakudya admin · API keys</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<main id="root"></main>

<template id="tpl">
  <h2>API keys and usage</h2>
  <div id="keystats" class="grid"></div>
  <h2>Usage trend <span class="muted">· last 7 days, Malawi time (CAT)</span></h2>
  <div class="card"><div id="trend" class="muted">Loading…</div></div>
  <div class="card wrap" style="margin-top:10px;padding:6px 10px"><table id="perKey" class="pk"></table></div>
  <p id="trendNote" class="muted"></p>
  <h2>Access keys</h2>
  <div class="card" id="createBox">
    <b>Create a key</b>
    <p class="muted" style="margin:4px 0 8px">Reviewer keys can only review packaged foods. Admin keys have full access. Developer keys are created by developers themselves.</p>
    <input id="kLabel" type="text" maxlength="80" placeholder="Name, e.g. Grace - reviewer" />
    <div class="bar" style="gap:8px;margin-top:8px">
      <select id="kRole"><option value="reviewer">Reviewer</option><option value="admin">Admin (full access)</option></select>
      <button id="kCreate" class="primary">Create key</button>
    </div>
    <p id="kMsg" class="muted" role="status"></p>
    <div id="reveal" class="reveal hide">
      <div><b>Copy this key now. It is shown once and cannot be recovered.</b></div>
      <code id="revealKey"></code>
      <div class="bar" style="gap:8px;margin-top:8px"><button id="copyKey">Copy</button><button id="doneKey">I saved it</button></div>
    </div>
  </div>
  <div class="bar" style="gap:6px;margin:12px 0 8px" id="keyFilter">
    <button data-f="active" class="chip on">Active</button><button data-f="revoked" class="chip">Revoked</button><button data-f="all" class="chip">All</button>
  </div>
  <div id="keyList"></div>
  <p class="muted">Usage counters are approximate and cover keys only, not anonymous calls.</p>
</template>

<script src="../js/config.js"></script>
<script src="admin.js"></script>
<script>
(() => {
  "use strict";
  const { $, esc, fmt, stat, ago, call, dayLabel, trendBars } = Admin;
  let usage = {};
  let keyRows = [];
  let lastKeys = null;
  let keyFilter = "active";

  function renderOverview(k) {
    const roles = Object.entries(k.by_role || {}).map(([r, n]) => `${n} ${r}`).join(", ");
    $("keystats").innerHTML = stat("Active keys", k.active) + stat("Total keys", k.total) + stat("Calls today", k.usage_today) + stat("Calls, 7 days", k.usage_last_7_days)
      + `<div class="stat"><b style="font-size:15px">${esc(roles || "none")}</b><span>Active by role</span></div>`;
    usage = Object.fromEntries((k.top || []).map((x) => [x.id, x]));
    lastKeys = k;
    renderTrend(k);
  }

  // Usage trend: total calls per Malawi (CAT) day (bars) and calls per key per day (heat table).
  // Needs api_keys.usage_daily and top[].daily from the API; older API versions only send totals.
  function renderTrend(k) {
    const days = Array.isArray(k.usage_daily) ? k.usage_daily : null;
    const t = $("trend"), tbl = $("perKey"), note = $("trendNote");
    if (!days || !days.length) {
      t.textContent = "The daily trend needs the latest API deploy. Totals above still work.";
      tbl.innerHTML = ""; note.textContent = ""; return;
    }
    const sum = days.reduce((n, d) => n + d.count, 0);
    t.classList.remove("muted");
    t.innerHTML = sum === 0 ? '<p class="muted" style="margin:0">No key calls recorded in the last 7 days.</p>' : trendBars(days);

    const rows = (k.top || []).filter((x) => Array.isArray(x.daily));
    const cellMax = Math.max(1, ...rows.flatMap((x) => x.daily));
    const head = `<tr><th class="k">Key<span class="kgrip" title="Drag to resize"></span></th>${days.map((d) => `<th class="num" style="text-align:center">${dayLabel(d.day)}</th>`).join("")}<th class="num">7 days</th></tr>`;
    const emailById = Object.fromEntries(keyRows.map((r) => [Number(r.id), r.owner_email]));
    const body = rows.map((x) => {
      const email = x.owner_email || emailById[Number(x.id)] || "";
      const cells = x.daily.map((n) => n
        ? `<td class="c" style="background:rgba(230,146,20,${(0.1 + 0.55 * (n / cellMax)).toFixed(2)})">${fmt(n)}</td>`
        : `<td class="c z">·</td>`).join("");
      return `<tr><td class="k"><b>${esc(x.label)}</b> <span class="pill">${esc(x.role)}</span>${email ? `<div class="muted" style="font-size:11px">${esc(email)}</div>` : ""}</td>${cells}<td class="num"><b>${fmt(x.last_7_days)}</b></td></tr>`;
    }).join("");
    const total = `<tr class="sum"><td class="k">All keys</td>${days.map((d) => `<td class="c">${fmt(d.count)}</td>`).join("")}<td class="num">${fmt(sum)}</td></tr>`;
    tbl.innerHTML = rows.length ? head + body + total : "";
    const shown = rows.length, active = typeof k.active === "number" ? k.active : shown;
    note.textContent = "Counts are approximate, by Malawi (CAT) day, for active keys only (revoked keys and anonymous calls are not included)."
      + (active > shown ? ` Showing the ${shown} busiest of ${active} active keys.` : "");
  }

  function renderKeys() {
    const rows = keyRows.filter((k) => keyFilter === "all" || (keyFilter === "revoked" ? k.revoked_at : !k.revoked_at));
    $("keyList").innerHTML = rows.map((k) => {
      const u = usage[k.id];
      const who = k.owner_email ? ` · ${esc(k.owner_email)}` : "";
      const meta = k.revoked_at
        ? `Revoked ${esc(ago(k.revoked_at))}`
        : `Today ${u ? fmt(u.today) : "–"} · 7 days ${u ? fmt(u.last_7_days) : "–"} · last used ${esc(ago(k.last_used_at))}`;
      const prefix = k.key_prefix ? ` · <span style="font-family:var(--mono)">${esc(k.key_prefix)}…</span>` : "";
      const btn = k.revoked_at ? "" : `<button class="danger" data-revoke="${Number(k.id)}">Revoke</button>`;
      return `<div class="key${k.revoked_at ? " revoked" : ""}"><div class="row"><div><b>${esc(k.label)}</b> <span class="pill">${esc(k.role || "admin")}</span><div class="muted">#${Number(k.id)}${who}${prefix}</div><div class="muted">${meta}</div></div>${btn}</div></div>`;
    }).join("") || `<p class="muted">No ${keyFilter === "all" ? "" : keyFilter + " "}keys.</p>`;
  }

  async function loadKeys() {
    const r = await call("/admin/keys");
    if (Admin.authFail(r)) return;
    if (r.status === 200 && Array.isArray(r.body?.data)) { keyRows = r.body.data; renderKeys(); }
  }

  function hideReveal() { $("revealKey").textContent = ""; $("reveal").classList.add("hide"); }

  Admin.mount({
    id: "keys",
    title: "API keys",
    init() {
      // Drag the handle in the Key header to stretch or shrink the key column (width is remembered).
      const pk = $("perKey");
      try { const w = parseInt(localStorage.getItem("keyColW"), 10); if (w >= 120) pk.style.setProperty("--kw", w + "px"); } catch (_) {}
      let drag = null;
      pk.addEventListener("pointerdown", (e) => {
        const g = e.target.closest(".kgrip"); if (!g) return;
        const th = g.closest("th");
        drag = { x: e.clientX, w: th.getBoundingClientRect().width };
        g.setPointerCapture(e.pointerId); e.preventDefault();
      });
      pk.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const w = Math.round(Math.min(Math.max(120, drag.w + e.clientX - drag.x), window.innerWidth * 0.9));
        pk.style.setProperty("--kw", w + "px");
      });
      const endDrag = () => {
        if (!drag) return; drag = null;
        try { localStorage.setItem("keyColW", parseInt(pk.style.getPropertyValue("--kw"), 10)); } catch (_) {}
      };
      pk.addEventListener("pointerup", endDrag);
      pk.addEventListener("pointercancel", endDrag);

      Admin.chips("keyFilter", "f", (v) => { keyFilter = v; renderKeys(); });

      document.addEventListener("click", async (e) => {
        const rv = e.target.closest("[data-revoke]");
        if (!rv) return;
        const id = Number(rv.dataset.revoke);
        const k = keyRows.find((x) => Number(x.id) === id);
        if (!k) return;
        const recent = k.last_used_at && Date.now() - new Date(k.last_used_at).getTime() < 86400000;
        const warn = recent ? "\n\nThis key was used in the last 24 hours. Anything using it will stop working." : "";
        if (!confirm(`Revoke "${k.label}" (${k.role || "admin"})? This cannot be undone.${warn}`)) return;
        rv.disabled = true;
        const r = await call("/admin/keys/" + id, { method: "DELETE" });
        if (r.status === 200) { $("status").textContent = `Revoked "${k.label}".`; await Admin.reload(); }
        else { rv.disabled = false; alert(r.status === 403 ? "Admin writes are switched off on the gateway." : "Couldn't revoke (" + (r.status || "network") + ")."); }
      });

      $("kCreate").addEventListener("click", async () => {
        const label = $("kLabel").value.trim(), role = $("kRole").value;
        if (!label) { $("kMsg").textContent = "Give the key a name."; return; }
        if (role === "admin" && !confirm(`Create a FULL-ACCESS admin key named "${label}"? It can change registry data and read everything. Only for people you trust completely.`)) return;
        $("kCreate").disabled = true; $("kMsg").textContent = "Creating…"; hideReveal();
        const r = await call("/admin/keys", { method: "POST", body: { label, role } });
        $("kCreate").disabled = false;
        if (r.status === 200 && r.body?.key) {
          $("kMsg").textContent = `Created "${label}" (${role}).`;
          $("kLabel").value = "";
          $("revealKey").textContent = r.body.key;
          $("reveal").classList.remove("hide");
          Admin.reload();
        } else {
          $("kMsg").textContent = r.status === 403 ? "Admin writes are switched off on the gateway." : (r.body?.error || r.body?.message || "Couldn't create the key (" + (r.status || "network") + ").");
        }
      });
      $("copyKey").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText($("revealKey").textContent); $("copyKey").textContent = "Copied"; setTimeout(() => ($("copyKey").textContent = "Copy"), 1500); }
        catch (_) { const r = document.createRange(); r.selectNodeContents($("revealKey")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copyKey").textContent = "Selected - copy it"; }
      });
      $("doneKey").addEventListener("click", hideReveal);
    },
    async refresh() {
      const d = await Admin.overview();
      if (!d) return;
      renderOverview(d.api_keys || {});
      await loadKeys();
      renderKeys();
      if (lastKeys) renderTrend(lastKeys);
    },
  });
})();
</script>
</body>
</html>
