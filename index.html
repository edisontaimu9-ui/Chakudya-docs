<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chakudya Nutrition Registry API - Developer Docs</title>
<meta name="description" content="Interactive API reference for the Chakudya Nutrition Registry (CNR) - Malawi's open food and nutrition data API." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ───────────────────────── Header ───────────────────────── -->
<header class="app-header" id="app-header">
  <div class="app-header__row">
    <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2.5 5h15M2.5 10h15M2.5 15h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <a class="brand" href="#/" aria-label="Chakudya Nutrition Registry home">
      <span class="brand__mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M13 3.5c3.2 3 4.8 6 4.8 9.5s-1.6 6.5-4.8 9.5c-3.2-3-4.8-6-4.8-9.5S9.8 6.5 13 3.5Z" fill="currentColor" opacity="0.9"/>
          <path d="M13 3.5v19" stroke="var(--bg)" stroke-width="0.8" opacity="0.5"/>
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">Chakudya</span>
        <span class="brand__sub">Nutrition Registry</span>
      </span>
    </a>

    <span class="version-chip" id="version-chip" title="API version">v-</span>

    <div class="header-search">
      <svg class="header-search__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11.2 11.2 14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="global-search" type="search" placeholder="Search endpoints…" aria-label="Search documentation" autocomplete="off" />
      <kbd class="header-search__kbd">/</kbd>
    </div>

    <div class="header-actions">
      <a class="icon-btn" id="github-link" href="#" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View on GitHub" hidden>
        <svg width="19" height="19" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.6 2.29 6.65 5.47 7.73.4.08.55-.17.55-.39 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.5-2.7-.96-.09-.23-.48-.96-.82-1.16-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.83.72 1.22 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.2-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.2-.36-1.03.08-2.15 0 0 .67-.22 2.2.84a7.4 7.4 0 0 1 2-.28c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.15.51.57.82 1.29.82 2.19 0 3.13-1.87 3.82-3.65 4.02.29.26.54.76.54 1.53 0 1.11-.01 2-.01 2.27 0 .22.15.48.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark or light theme" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3.6" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.2v2M9 14.8v2M16.8 9h-2M3.2 9h-2M14.6 3.4l-1.4 1.4M4.8 13.2l-1.4 1.4M14.6 14.6l-1.4-1.4M4.8 4.8 3.4 3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15.5 10.8A6.8 6.8 0 0 1 7.2 2.5 6.8 6.8 0 1 0 15.5 10.8Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="app-header__row app-header__row--base-url">
    <label class="base-url" for="base-url-input">
      <span class="base-url__label">Base URL</span>
      <select id="base-url-select" aria-label="Choose a preset base URL">
        <option value="">Custom…</option>
      </select>
      <input id="base-url-input" type="text" spellcheck="false" placeholder="https://your-worker.workers.dev" />
      <button class="base-url__reset" id="base-url-reset" title="Reset to production URL" aria-label="Reset base URL">↺</button>
    </label>
    <span class="base-url__hint" id="cors-hint"></span>
  </div>
</header>

<div class="app-shell">

  <!-- ───────────────────────── Sidebar ───────────────────────── -->
  <nav class="sidebar" id="sidebar" aria-label="API endpoints">
    <div class="sidebar__search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11.2 11.2 14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="sidebar-search" type="search" placeholder="Filter…" aria-label="Filter endpoint list" autocomplete="off" />
    </div>
    <div class="sidebar__scroll" id="sidebar-groups">
      <div class="sidebar__loading">Loading endpoints…</div>
    </div>
    <div class="sidebar__footer">
      <a href="#/" class="sidebar__overview-link">Overview</a>
      <span class="sidebar__count" id="endpoint-count"></span>
    </div>
  </nav>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <!-- ───────────────────────── Main ───────────────────────── -->
  <main class="main" id="main" tabindex="-1">
    <div id="content" class="content">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading Chakudya API reference…</p>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<template id="tpl-param-row">
  <tr>
    <td class="param-name"></td>
    <td class="param-type"></td>
    <td class="param-in"></td>
    <td class="param-desc"></td>
  </tr>
</template>

<script src="js/state.js"></script>
<script src="js/theme.js"></script>
<script src="js/spec-loader.js"></script>
<script src="js/schema-example.js"></script>
<script src="js/copy.js"></script>
<script src="js/api-client.js"></script>
<script src="js/status-panel.js"></script>
<script src="js/render-endpoint.js"></script>
<script src="js/demo-terminal.js"></script>
<script src="js/render-overview.js"></script>
<script src="js/try-it.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/search.js"></script>
<script src="js/main.js"></script>
</body>
</html>
