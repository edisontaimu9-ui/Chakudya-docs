<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline - Chakudya Nutrition Registry</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0e1210" />
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" />
<style>
  :root { color-scheme: light dark; --bg: #0e1210; --card: #141a17; --text: #eef1ec; --muted: #a9b2a9; --border: #263029; --accent: #e69214; --ink: #1d1102; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2f3ed; --card: #ffffff; --text: #181c16; --muted: #4f5748; --border: #dcdfd2; --accent: #b25d04; --ink: #ffffff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { width: 100%; max-width: 460px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 36px 28px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font: 700 26px/1.2 Georgia, "Times New Roman", serif; margin: 20px 0 10px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
  a, button { font: 600 15px/1 inherit; font-family: inherit; padding: 13px 20px; border-radius: 11px; text-decoration: none; cursor: pointer; border: 1px solid var(--border); color: var(--text); background: transparent; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  small { display: block; margin-top: 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="assets/icons/icon-192.png" width="88" height="88" alt="" />
  <h1>You're offline</h1>
  <p>Chakudya couldn't reach the network, and this page isn't saved on your device yet.</p>
  <p>Reconnect and try again. Once you've opened the docs online, the documentation opens offline too.</p>
  <div class="actions">
    <button class="primary" type="button" onclick="location.reload()">Try again</button>
    <a href="./">Open saved docs</a>
  </div>
  <small>Live data such as database statistics and API requests always needs a connection.</small>
</main>
<script>
  // If the connection returns while this page is open, go straight back to the docs.
  addEventListener("online", function () { location.replace("./"); });
</script>
</body>
</html>
