openapi: 3.0.3
info:
  title: Chakudya Nutrition Registry API (CNR)
  description: >
    Chakudya is a Malawi focused nutrition data and intelligence API. It
    provides structured, searchable nutrition information for health
    applications, researchers, students, dietitians, and developers
    building tools for clinical or public health nutrition work. The API
    combines local food composition data with international sources such
    as USDA FoodData Central, Open Food Facts, and FatSecret, and adds
    retrieval augmented question answering and session memory for AI
    assisted applications.
  version: "1.26.0"
  contact:
    name: Edison Taimu
    x-location: Blantyre, Malawi
  license:
    name: UNLICENSED

servers:
  - url: "https://{worker-subdomain}.workers.dev"
    description: Cloudflare Workers deployment - set your own base URL in Try It.
    variables:
      worker-subdomain:
        default: your-worker

security:
  - {}
  - bearerAuth: []

tags:
  - name: Meta
  - name: Health
  - name: Batch
  - name: API Keys
  - name: Foods
  - name: Glycaemic Index
  - name: Exchange
  - name: Renal
  - name: Formulas
  - name: Drug Interactions
  - name: Packaged
  - name: Favorites
  - name: History
  - name: Food Log
  - name: Recipes
  - name: Meals
  - name: Ingredients
  - name: DRI
  - name: RAG
  - name: Memory

paths:
  /:
    get:
      tags: [Meta]
      summary: API metadata
      description: Returns CNR metadata, version, auth summary, and a full endpoint map.
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health:
    get:
      tags: [Health]
      summary: Upstream service health check
      description: >
        Pings Supabase, Cohere, Groq, and Open Food Facts in parallel.
        Reports per-service status plus an overall healthy/degraded
        verdict. Open Food Facts is live-pinged too (free/keyless) but,
        like USDA FDC/FatSecret/the rate-limit KV (reported as
        configured/bound without a network call), it's visibility-only
        and doesn't affect the overall verdict.
      security: []
      responses:
        "200":
          description: All required upstreams reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: One or more required upstreams (Supabase/Cohere/Groq) failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /batch:
    post:
      tags: [Batch]
      summary: Run several sub-requests in one round trip
      description: >
        Fans out to routeSingle() per sub-request - same auth, rate-limit,
        and edge-cache pipeline as a normal top-level request, so batching
        cannot bypass per-resource auth or rate limits. Nested /batch
        sub-requests are rejected. The batch endpoint has its own (tighter)
        rate limit. Results always come back in request order; one
        sub-request failing never short-circuits the rest.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [method, path]
                    properties:
                      id: { type: string, description: "Echoed back to match results to requests; defaults to array index." }
                      method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
                      path: { type: string, example: "/foods/lookup?query=nsima" }
                      body: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Per-item results, always in request order
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: integer }
                        body: {}
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      duration_ms: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /admin/keys:
    get:
      tags: [API Keys]
      summary: List API keys (root key only)
      description: Never returns the raw key or its hash - id/label/timestamps only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [API Keys]
      summary: Create a new API key (root key only)
      description: >
        The raw key is returned exactly once in the response - only its
        SHA-256 hash is stored. If lost, revoke it and mint a new one.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, example: "Grace - reviewer" }
                role:
                  type: string
                  enum: [admin, reviewer]
                  default: admin
                  description: >
                    "admin" = full access (default). "reviewer" = packaged
                    review queue (pending/approve/reject) + reads only.
      responses:
        "200":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Raw key - shown once only.
                        example: "cnr_9f2a1b...c81b"
                      data: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (root key only)
      description: Soft-revoke - sets `revoked_at`, the row is kept for audit history.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /foods:
    get:
      tags: [Foods]
      summary: List foods
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Foods]
      summary: Create a food (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/bulk:
    post:
      tags: [Foods]
      summary: Bulk-create foods (admin)
      description: >
        Batch insert, max 500 items per request, all-or-nothing (one
        PostgREST request - a constraint violation on any row rejects the
        whole batch).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /foods/lookup:
    get:
      tags: [Foods]
      summary: External food lookup cascade (public, rate-limited)
      description: >
        Local cache → USDA FDC (name search) → Open Food Facts (barcode) →
        FatSecret barcode lookup (Premier-exclusive) → FatSecret (name
        search). First external hit is cached into external_foods_cache so
        subsequent lookups skip upstream calls.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Name search (tries USDA, then FatSecret).
        - name: barcode
          in: query
          schema: { type: string }
          description: Barcode lookup (Open Food Facts, then FatSecret).
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/autocomplete:
    get:
      tags: [Foods]
      summary: Search-as-you-type suggestions (public, rate-limited)
      description: >
        Wraps FatSecret's Premier-exclusive foods.autocomplete.v2. Requires
        FATSECRET_CONSUMER_KEY/SECRET on a Premier or Premier Free plan -
        returns 503 if not configured on this deployment.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Partial search expression, e.g. "chic".
        - name: max_results
          in: query
          schema: { type: integer, default: 4, maximum: 10 }
      responses:
        "200":
          description: Suggested search expressions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: FatSecret credentials not configured on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /foods/categories:
    get:
      tags: [Foods]
      summary: Food category list (public, rate-limited, cached 24h)
      description: >
        Wraps FatSecret's Premier-exclusive food_categories.get.v2 -
        near-static reference data. Requires FATSECRET_CONSUMER_KEY/SECRET
        on a Premier or Premier Free plan - returns 503 if not configured
        on this deployment.
      security: []
      responses:
        "200":
          description: Food categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            description: { type: string, nullable: true }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: FatSecret credentials not configured on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /foods/search:
    get:
      tags: [Foods]
      summary: Typo-tolerant fuzzy search over foods (public, rate-limited)
      description: >
        Postgres pg_trgm word_similarity() over food_name, so a misspelled
        Malawian food name (e.g. "Chinagwa" for "Chinangwa") still resolves
        - unlike GET /foods?search=, which requires an exact substring.
        Runs between the exact-ilike local match and the external cache/API
        cascade inside /foods/lookup and everything built on it.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: max_results
          in: query
          schema: { type: integer, default: 8, minimum: 1, maximum: 25 }
        - name: min_similarity
          in: query
          description: Per-word similarity floor, 0-1.
          schema: { type: number, default: 0.35, minimum: 0, maximum: 1 }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/substitutes:
    get:
      tags: [Foods]
      summary: Nutritionally close substitutes for a food (public, rate-limited)
      description: >
        Resolves the food (local match, falling back to the external
        lookup cascade), classifies it into a Malawi-relevant substitution
        group (e.g. protein/legumes are grouped together, cassava/potatoes
        with grains), and ranks other foods in that group by closeness on
        the group's primary nutrient per 100g. Purely computational, no
        writes. Doesn't account for cost, local availability, taste, or
        portion size.
      security: []
      parameters:
        - name: food_name
          in: query
          required: true
          schema: { type: string, example: chicken }
        - name: limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 15 }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/compare:
    get:
      tags: [Foods]
      summary: Side-by-side nutrient comparison of 2-6 foods (public, rate-limited)
      description: >
        Resolves each comma-separated food name the same way
        /foods/substitutes resolves one, then returns each food's per-100g
        macro/micronutrient panel plus, only where a sourced row exists in
        glycaemic_index_data, a measured glycaemic block - GI/GL is never
        estimated. Also returns nutrient_comparison, the same fields
        pivoted per-nutrient with the highest/lowest food flagged.
      security: []
      parameters:
        - name: foods
          in: query
          required: true
          description: Comma-separated list of 2-6 food names.
          schema: { type: string, example: "nsima,rice,potatoes" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /foods/{id}/label:
    get:
      tags: [Foods]
      summary: Codex-style nutrition facts label for a food
      description: >
        Builds a standardized Codex STAN 1-1985-style nutrition label from
        a food's serving-size data (see Serving-Size Intelligence). Pass
        ?serving= to pick a specific serving_sizes label; defaults to the
        most specific one available (own FCT measure, then a curated
        keyword match, then a generic per-category estimate).
      security: []
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: serving
          in: query
          description: Case-insensitive substring match against a serving_sizes label.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No serving-size data available to build a label from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /foods/{id}:
    get:
      tags: [Foods]
      summary: Get a food by id
      security: []
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Foods]
      summary: Replace a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Foods]
      summary: Partially update a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Food" }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Foods]
      summary: Delete a food (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /glycaemic-index:
    get:
      tags: [Glycaemic Index]
      summary: List glycaemic index/load reference entries
      description: >
        Standalone, source-cited GI/GL reference table (sql/004_add_glycaemic_index.sql).
        Matched by keyword at query time (see GET /foods/compare and
        /rag/ask) rather than joined to `foods` by foreign key, since GI/GL
        is measured per specific preparation/variety and rarely lines up
        1:1 with a foods row.
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Glycaemic Index]
      summary: Create a glycaemic index entry (admin)
      description: >
        Requires food_name, a non-empty match_keywords array, and source -
        GI/GL values are never accepted without a traceable citation.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [food_name, match_keywords, source]
              properties:
                food_name: { type: string }
                match_keywords: { type: array, items: { type: string } }
                source: { type: string }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /glycaemic-index/bulk:
    post:
      tags: [Glycaemic Index]
      summary: Bulk-create glycaemic index entries (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /glycaemic-index/{id}:
    get:
      tags: [Glycaemic Index]
      summary: Get a glycaemic index entry by id
      security: []
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Glycaemic Index]
      summary: Replace a glycaemic index entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Glycaemic Index]
      summary: Partially update a glycaemic index entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Glycaemic Index]
      summary: Delete a glycaemic index entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange:
    get:
      tags: [Exchange]
      summary: List diabetes/renal exchange list entries
      security: []
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Exchange]
      summary: Create an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange/bulk:
    post:
      tags: [Exchange]
      summary: Bulk-create exchange list entries (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange/{id}:
    put:
      tags: [Exchange]
      summary: Replace an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Exchange]
      summary: Partially update an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Exchange]
      summary: Delete an exchange list entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal:
    get:
      tags: [Renal]
      summary: List renal foods
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/ListOrCursor" }
    post:
      tags: [Renal]
      summary: Create a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal/bulk:
    post:
      tags: [Renal]
      summary: Bulk-create renal food entries (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200": { $ref: "#/components/responses/BulkSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /renal/{id}:
    put:
      tags: [Renal]
      summary: Replace a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Renal]
      summary: Partially update a renal food entry (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
