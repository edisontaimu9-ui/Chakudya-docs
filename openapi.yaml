            schema:
              type: object
              required: [user_id, meal_type, calories]
              properties:
                user_id: { type: string }
                meal_type: { type: string, enum: [breakfast, lunch, snack, dinner] }
                calories: { type: number, minimum: 0 }
                food_name: { type: string, nullable: true }
                entry_date: { type: string, format: date, description: "Defaults to today." }
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }

