  /packaged/submit:
    post:
      tags: [Packaged]
      summary: Submit a packaged food (public, rate-limited)
      description: >
        Requires barcode + product_name. Auto-tagged status=pending. See
        the README for normalization (`per`/`serving_size`), duplicate
        detection (409 if an approved/pending row already has this
        barcode; overwritten in place if the existing row was rejected),
        and the macro/calorie cross-check (`needs_review`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode, product_name]
              properties:
                barcode: { type: string }
                product_name: { type: string }
                per: { type: string, enum: ["100g", "100ml", serving] }
                serving_size: { type: string, example: "30g" }
              additionalProperties: true
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Barcode already has an approved/pending entry - not inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  already_exists: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/PackagedFood" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /packaged/scan:
    post:
      tags: [Packaged]
      summary: Submit a packaged food via photo (public, rate-limited)
      description: >
        Sends 1-5 photos to a Groq vision model, combines what it reads
        across all of them, and inserts a pending row with source=ocr_ai.
        Returns 422 (status=needs_retry) without writing if no photo shows
        a legible nutrition label. Same duplicate-detection and
        macro/calorie-check behavior as /packaged/submit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    description: data:image/...;base64,... URL or bare base64 (assumed JPEG).
                barcode:
                  type: string
                  description: Optional - takes priority over anything the model reads.
      responses:
        "200": { $ref: "#/components/responses/MutationSuccess" }
        "422":
          description: No photo showed a legible nutrition label - nothing written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: needs_retry }
                  message: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

